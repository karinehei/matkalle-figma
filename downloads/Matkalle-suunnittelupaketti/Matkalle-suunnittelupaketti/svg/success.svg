<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1160" viewBox="0 0 390 1160"><rect x="0" y="0" width="390" height="1160" rx="0" fill="#f7f8f3" stroke="none"/><rect x="24" y="24" width="31" height="31" rx="16" fill="#124c43" stroke="none"/><text x="32" y="47" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#d5ed9b"><tspan x="32" dy="0">↗</tspan></text><text x="65" y="47" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#173e37"><tspan x="65" dy="0">matkalle.</tspan></text><rect x="0" y="76" width="390" height="31" rx="0" fill="#ecefe3" stroke="none"/><text x="24" y="94" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#4a5d43"><tspan x="24" dy="0">PORTFOLIOKONSEPTI · ESIMERKKIDATA</tspan></text><text x="24" y="140" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="700" fill="#4e7162"><tspan x="24" dy="0">REITISTÄ OIKEAAN LIPPUUN</tspan></text><text x="24" y="191" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="650" fill="#173e37"><tspan x="24" dy="0">Hyvä matka alkaa</tspan><tspan x="24" dy="45">selkeydestä.</tspan></text><text x="24" y="275" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#586c65"><tspan x="24" dy="0">Olet kulkenut reitin valinnasta lipun</tspan><tspan x="24" dy="19">demovahvistukseen.</tspan></text><rect x="24" y="324" width="23" height="23" rx="12" fill="#e9f2e9" stroke="none"/><text x="32" y="338" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="650" fill="#124c43"><tspan x="32" dy="0">1</tspan></text><text x="53" y="338" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#586c65"><tspan x="53" dy="0">Reitti</tspan></text><rect x="140" y="324" width="23" height="23" rx="12" fill="#e9f2e9" stroke="none"/><text x="148" y="338" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="650" fill="#124c43"><tspan x="148" dy="0">2</tspan></text><text x="169" y="338" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#586c65"><tspan x="169" dy="0">Lippu ja maksu</tspan></text><rect x="256" y="324" width="23" height="23" rx="12" fill="#124c43" stroke="none"/><text x="264" y="338" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="650" fill="#fff"><tspan x="264" dy="0">3</tspan></text><text x="285" y="338" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#124c43"><tspan x="285" dy="0">Vahvistus</tspan></text><rect x="24" y="371" width="342" height="92" rx="12" fill="#eef5eb" stroke="#d4e1cf"/><text x="40" y="400" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="650" fill="#173e37"><tspan x="40" dy="0">✓ Demovahvistus valmis</tspan></text><text x="40" y="423" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#405e51"><tspan x="40" dy="0">Esimerkkitilauksesi onnistui. Mitään ei</tspan><tspan x="40" dy="17">veloitettu.</tspan></text><rect x="24" y="479" width="342" height="109" rx="12" fill="#eef5eb" stroke="#d4e1cf"/><text x="40" y="508" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="650" fill="#173e37"><tspan x="40" dy="0">Kertalippu AB · aikuinen</tspan></text><text x="40" y="531" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#405e51"><tspan x="40" dy="0">Pasilan asema → Meilahti</tspan><tspan x="40" dy="17">Esimerkkihinta 3,50 €</tspan><tspan x="40" dy="17">Ei kelpaa matkalipuksi.</tspan></text><rect x="24" y="604" width="342" height="51" rx="10" fill="#124c43" stroke="none"/><text x="39" y="632" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="650" fill="#fff"><tspan x="39" dy="0">Suunnittele uusi matka  →</tspan></text><text x="24" y="685" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#586c65"><tspan x="24" dy="0">Demovahvistus ei ole oikea matkalippu. Voit</tspan><tspan x="24" dy="17">suunnitella uuden esimerkkimatkan.</tspan></text><text x="24" y="1132" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="400" fill="#586c65"><tspan x="24" dy="0">Matkalle · Itsenäinen UX/UI-portfoliokonsepti</tspan></text></svg>