<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1160" viewBox="0 0 390 1160"><rect x="0" y="0" width="390" height="1160" rx="0" fill="#f7f8f3" stroke="none"/><rect x="24" y="24" width="31" height="31" rx="16" fill="#124c43" stroke="none"/><text x="32" y="47" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#d5ed9b"><tspan x="32" dy="0">↗</tspan></text><text x="65" y="47" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#173e37"><tspan x="65" dy="0">matkalle.</tspan></text><rect x="0" y="76" width="390" height="31" rx="0" fill="#ecefe3" stroke="none"/><text x="24" y="94" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#4a5d43"><tspan x="24" dy="0">PORTFOLIOKONSEPTI · ESIMERKKIDATA</tspan></text><text x="24" y="140" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="700" fill="#4e7162"><tspan x="24" dy="0">REITISTÄ OIKEAAN LIPPUUN</tspan></text><text x="24" y="191" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="650" fill="#173e37"><tspan x="24" dy="0">Matkasi vaihe</tspan><tspan x="24" dy="45">vaiheelta.</tspan></text><text x="24" y="275" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#586c65"><tspan x="24" dy="0">Tarkista reitti rauhassa. Seuraavaksi valitaan</tspan><tspan x="24" dy="19">lippu.</tspan></text><rect x="24" y="324" width="23" height="23" rx="12" fill="#124c43" stroke="none"/><text x="32" y="338" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="650" fill="#fff"><tspan x="32" dy="0">1</tspan></text><text x="53" y="338" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#124c43"><tspan x="53" dy="0">Reitti</tspan></text><rect x="140" y="324" width="23" height="23" rx="12" fill="#e9f2e9" stroke="none"/><text x="148" y="338" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="650" fill="#124c43"><tspan x="148" dy="0">2</tspan></text><text x="169" y="338" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#586c65"><tspan x="169" dy="0">Lippu ja maksu</tspan></text><rect x="256" y="324" width="23" height="23" rx="12" fill="#e9f2e9" stroke="none"/><text x="264" y="338" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="650" fill="#124c43"><tspan x="264" dy="0">3</tspan></text><text x="285" y="338" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="600" fill="#586c65"><tspan x="285" dy="0">Vahvistus</tspan></text><text x="24" y="383" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="550" fill="#124c43"><tspan x="24" dy="0">← Takaisin</tspan></text><text x="24" y="419" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#173e37"><tspan x="24" dy="0">Pasilan asema → Meilahti</tspan><tspan x="24" dy="20">21 min · kävelyä 550 m · ei vaihtoja</tspan></text><rect x="24" y="461" width="342" height="75" rx="12" fill="#eef5eb" stroke="#d4e1cf"/><text x="40" y="490" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="650" fill="#173e37"><tspan x="40" dy="0">10.15 · Pasilan asema</tspan></text><text x="40" y="513" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#405e51"><tspan x="40" dy="0">Kävele esimerkkipysäkille, noin 250 metriä.</tspan></text><rect x="24" y="552" width="342" height="75" rx="12" fill="#eef5eb" stroke="#d4e1cf"/><text x="40" y="581" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="650" fill="#173e37"><tspan x="40" dy="0">B1 · Bussi kohti määränpäätä</tspan></text><text x="40" y="604" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#405e51"><tspan x="40" dy="0">Seuraa linjan B1 esimerkkireittiä.</tspan></text><rect x="24" y="643" width="342" height="75" rx="12" fill="#eef5eb" stroke="#d4e1cf"/><text x="40" y="672" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="650" fill="#173e37"><tspan x="40" dy="0">10.36 · Meilahti</tspan></text><text x="40" y="695" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#405e51"><tspan x="40" dy="0">Kävele loppumatka. Kävelyä yhteensä 550 metriä.</tspan></text><rect x="24" y="734" width="342" height="92" rx="12" fill="#eef5eb" stroke="#d4e1cf"/><text x="40" y="763" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="650" fill="#173e37"><tspan x="40" dy="0">Matka kulkee vyöhykkeillä A ja B.</tspan></text><text x="40" y="786" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#405e51"><tspan x="40" dy="0">Näytämme seuraavaksi tähän esimerkkimatkaan</tspan><tspan x="40" dy="17">sopivan lipun.</tspan></text><rect x="24" y="842" width="342" height="51" rx="10" fill="#124c43" stroke="none"/><text x="39" y="870" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="650" fill="#fff"><tspan x="39" dy="0">Valitse matkaan sopiva lippu  →</tspan></text><text x="24" y="923" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#586c65"><tspan x="24" dy="0">Reittitieto on saatavilla myös ilman karttaa.</tspan></text><text x="24" y="1132" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="400" fill="#586c65"><tspan x="24" dy="0">Matkalle · Itsenäinen UX/UI-portfoliokonsepti</tspan></text></svg>