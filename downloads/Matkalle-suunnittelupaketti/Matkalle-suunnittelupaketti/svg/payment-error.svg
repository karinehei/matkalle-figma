" rx="12" fill="#eef5eb" stroke="#d4e1cf"/><text x="40" y="861" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="650" fill="#173e37"><tspan x="40" dy="0">Tämä on demovaihe.</tspan></text><text x="40" y="884" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#405e51"><tspan x="40" dy="0">Kortti- tai henkilötietoja ei kysytä eikä rahaa</tspan><tspan x="40" dy="17">veloiteta. Demovahvistus ei kelpaa</tspan><tspan x="40" dy="17">matkalipuksi.</tspan></text><rect x="24" y="957" width="342" height="51" rx="10" fill="#124c43" stroke="none"/><text x="39" y="985" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="650" fill="#fff"><tspan x="39" dy="0">Yritä demomaksua uudelleen  →</tspan></text><text x="24" y="1132" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="400" fill="#586c65"><tspan x="24" dy="0">Matkalle · Itsenäinen UX/UI-portfoliokonsepti</tspan></text></svg>